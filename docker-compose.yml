services:
  floci:
    image: floci/floci:latest
    container_name: afripay-floci
    ports:
      - "4566:4566"
    environment:
      - FLOCI_STORAGE_MODE=persistent
      - FLOCI_DATA_DIR=/data
      - FLOCI_SERVICES_LAMBDA_DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - ./.floci-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_floci/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - afripay-net

  postgres:
    image: postgres:16-alpine
    container_name: afripay-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: afripay_ledger
      POSTGRES_USER: afripay
      POSTGRES_PASSWORD: local_dev_password
    volumes:
      - ./.postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afripay -d afripay_ledger"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - afripay-net

networks:
  afripay-net:
    driver: bridge